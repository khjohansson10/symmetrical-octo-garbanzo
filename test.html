<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <title>Google</title>
    <style>
        /* --- CORE VISUAL CANVAS RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: #ffffff; /* Use #121212 for Dark Mode */
            overflow: hidden;
        }

        /* --- CONTAINER 1: FAKE GOOGLE HOMEPAGE & AUTOCOMPLETE TIER --- */
        #viewGoogleHome {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: none;
        }

        .home-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            user-select: none;
            -webkit-user-select: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- DYNAMIC TRANSITION INPUT BOX SYSTEM --- */
        /* DEFAULT STATE: Stretched completely across the screen over the google_home search bar */
        .invisible-search-input {
            position: absolute;
            top: 36.5%; 
            left: 0;
            width: 100%;
            height: 46px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 17px;
            color: transparent; /* Hides the native typing cursor/caret before they tap */
            padding: 0 20px;
            z-index: 9999;
            cursor: pointer;
        }

        /* TYPING ACTIVE STATE: Snaps instantly up to fill the top layout bar width */
        .invisible-search-input.typing-active {
            top: 14px;      
            left: 0;        
            width: 100%;    /* Fills the horizontal space so text field tracking is bulletproof */
            height: 46px;
            background: transparent;
            border: none;
            outline: none;
            
            /* MAGIC TRICK SHORTCUT: Fully blinds both the typed characters and the flashing cursor line */
            color: transparent !important;
            caret-color: transparent !important;
            
            /* Removes standard mobile browser tap highlights */
            -webkit-tap-highlight-color: transparent; 
            cursor: text;
        }

        /* Hidden magnifying glass trigger hotzone (shifted up to match the top bar right side) */
        .search-trigger-hotzone {
            position: absolute;
            top: 14px;
            right: 5%;
            width: 50px;
            height: 46px;
            background: transparent;
            cursor: pointer;
            z-index: 40;
            display: none; /* Only reveals when typing starts */
        }

        /* --- DYNAMIC TARGET AUTOCOMPLETE PREDICTION TIER --- */
        .autocomplete-suggestion-hotzone {
            position: absolute;
            
            /* GEOMETRIC COORDINATES: Shifted down to line up perfectly over the top 3 autocomplete lines */
            top: 70px;
            left: 0;
            width: 100%;
            height: 180px;
            
            /* DIAGNOSTIC CHECK ONLY: Temporary blue color so you can physically see the box bounds */
            /* background: rgba(0, 150, 255, 0.45); 
            
            cursor: pointer;
            z-index: 50;
            display: none;      /* Stays completely hidden until character length is greater than 0 */
            -webkit-tap-highlight-color: transparent; /* Clean touch reset */
        }


        /* --- CONTAINER 2: SCROLLABLE RESULTS ENGINE --- */
        #viewGoogleResults {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch;
            display: none;
        }

        .results-scroll-strip {
            width: 100%;
            height: auto; 
            display: block;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- ADJUSTED: Shifted up to align exactly over the blue title card --- */
        .target-result-link-hotzone {
            position: absolute;
            top: 149px;        /* Changed from 218px to 125px to pull it cleanly upward */
            left: 0;
            width: 100%;
            height: 95px;     
            background: transparent;
            cursor: pointer;
            z-index: 20;
            transition: background-color 0.05s ease;
        }

        /* Turns the hotzone container gray when actively triggered */
        .target-result-link-hotzone.flash-active {
            background-color: rgba(0, 0, 0, 0.08); 
        }

        /* Display State Utility Class */
        .active-view { display: block !important; }
    </style>
</head>
<body>

    <!-- SCREEN 1: THE FAKE SEARCH INTERFACE LAYER -->
    <div id="viewGoogleHome" class="active-view">
        <img id="googleHomeBg" src="./images/google_home.png" alt="Google Search Portal" class="home-bg-img">
        
        <!-- Single Input Container: Starts at center, switches seamlessly to full-width top alignment -->
        <input type="text" id="fakeSearchQuery" class="invisible-search-input" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div id="btnExecuteSearch" class="search-trigger-hotzone"></div>
        
        <div id="autocompleteHotzone" class="autocomplete-suggestion-hotzone"></div>
    </div>

    <!-- SCREEN 2: SCROLLABLE SEARCH RESULTS INTERFACE -->
    <div id="viewGoogleResults">
        <img src="./images/google_results.png" alt="Google Query Results" class="results-scroll-strip">
        <div id="linkTargetResult" class="target-result-link-hotzone"></div>
    </div>

    <script>
        const fakeSearchQuery = document.getElementById('fakeSearchQuery');
        const googleHomeBg = document.getElementById('googleHomeBg');
        const autocompleteHotzone = document.getElementById('autocompleteHotzone');
        
        const btnExecuteSearch = document.getElementById('btnExecuteSearch');
        const linkTargetResult = document.getElementById('linkTargetResult');
        
        const viewGoogleHome = document.getElementById('viewGoogleHome');
        const viewGoogleResults = document.getElementById('viewGoogleResults');

        // --- TRANSITION FROM HOME SCREEN VIEW TO TYPING STATE ---
        fakeSearchQuery.addEventListener('focus', function() {
            fakeSearchQuery.classList.add('typing-active');
            btnExecuteSearch.style.display = 'block';

            if (fakeSearchQuery.value === "") {
                googleHomeBg.src = "./images/blank.png";
            }
        });

      // --- DYNAMIC SEARCH INTERACTION MAPPING ENGINE (CHARACTER COUNT UPGRADE) ---
        fakeSearchQuery.addEventListener('input', function() {
            // Note: We use .length directly on the untrimmed value so spaces count as characters
            const currentLength = fakeSearchQuery.value.length;

            // Automatically reveal the autocomplete hotzone layer for any active input state
            if (currentLength > 0) {
                autocompleteHotzone.style.display = "block";
            }

            switch (currentLength) {
                case 0:
                    googleHomeBg.src = "./images/blank.png";
                    autocompleteHotzone.style.display = "none";
                    break;
                case 1: // "r"
                    googleHomeBg.src = "./images/r.png";
                    break;
                case 2: // "ra"
                    googleHomeBg.src = "./images/ra.png";
                    break;
                case 3: // "ran"
                    googleHomeBg.src = "./images/ran.png";
                    break;
                case 4: // "rand"
                    googleHomeBg.src = "./images/rand.png";
                    break;
                case 5: // "rando"
                    googleHomeBg.src = "./images/rando.png";
                    break;
                case 6: // "random"
                case 7: // "random "
                    googleHomeBg.src = "./images/random.png";
                    break;
                case 8: // "random w"
                    googleHomeBg.src = "./images/random w.png";
                    break;
                case 9: // "random wo"
                    googleHomeBg.src = "./images/random wo.png";
                    break;
                case 10: // "random wor"
                    googleHomeBg.src = "./images/random wor.png";
                    break;
                case 11: // "random word"
                case 12: // "random word "
                    googleHomeBg.src = "./images/random word.png";
                    break;
                case 13: // "random word g"
                    googleHomeBg.src = "./images/random word g.png";
                    break;
                case 14: // "random word ge"
                    googleHomeBg.src = "./images/random word ge.png";
                    break;
                case 15: // "random word gen"
                    googleHomeBg.src = "./images/random word gen.png";
                    break;
                case 16: // "random word gene"
                    googleHomeBg.src = "./images/random word gene.png";
                    break;
                case 17: // "random word gener"
                    googleHomeBg.src = "./images/random word gener.png";
                    break;
                case 18: // "random word genera"
                    googleHomeBg.src = "./images/random word genera.png";
                    break;
                case 19: // "random word generat"
                    googleHomeBg.src = "./images/random word generat.png";
                    break;
                case 20: // "random word generato"
                    googleHomeBg.src = "./images/random word generato.png";
                    break;
                default: // 21 or more characters (e.g., "random word generator")
                    googleHomeBg.src = "./images/random word generator.png";
                    break;
            }
        });

        // --- UNIFIED SEARCH LOADING ENGINE ANIMATION SEQUENCE ---
        function triggerLoadingSequence() {
            // Step 1: Switch background to "random word generator" instantly
            googleHomeBg.src = "./images/random word generator.png";
            googleHomeBg.style.visibility = 'visible'; // Ensure it's explicitly shown
            
            // Step 2: After 0.12 seconds, go COMPLETELY BLANK (true code-based blank canvas)
            setTimeout(() => {
                // Hides the image asset completely to show a raw, empty page background
                googleHomeBg.style.visibility = 'hidden'; 
                
                // Step 3: After 0.1 seconds, change to load_2 and reveal the image layer again
                setTimeout(() => {
                    googleHomeBg.src = "./images/load_2.png";
                    googleHomeBg.style.visibility = 'visible';
                    
                    // Step 4: After 0.1 seconds, change to load_3
                    setTimeout(() => {
                        googleHomeBg.src = "./images/load_3.png";
                        
                        // Step 5: After 0.1 seconds, change to load_4
                        setTimeout(() => {
                            googleHomeBg.src = "./images/load_4.png";
                            
                            // Step 6: After 0.05 seconds, change to load_5
                            setTimeout(() => {
                                googleHomeBg.src = "./images/load_5.png";
                                
                                // Step 7: After final 0.05 seconds, switch cleanly to Results view
                                setTimeout(() => {
                                    viewGoogleHome.classList.remove('active-view');
                                    viewGoogleResults.classList.add('active-view');
                                }, 50);
                                
                            }, 50);
                            
                        }, 100);
                        
                    }, 100);
                    
                }, 100);
                
            }, 120); // 0.12 seconds
        }

        // --- VIEWPORT TRANSITION TRIGGERS ---
        function processSearchTransition() {
            if (fakeSearchQuery.value.trim() === "") return; 
            triggerLoadingSequence();
        }

        // Trigger loading when clicking the hidden magnifying glass hotzone
        btnExecuteSearch.addEventListener('click', processSearchTransition);

        // Trigger loading when hitting 'Enter' on the keyboard
        fakeSearchQuery.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                fakeSearchQuery.blur(); // Seamlessly retracts mobile keyboards out of the viewport path
                processSearchTransition();
            }
        });

        // Trigger loading when clicking the first autocomplete option row
        autocompleteHotzone.addEventListener('click', function() {
            fakeSearchQuery.blur();
            triggerLoadingSequence(); // Bypasses blank checks to guarantee immediate performance execution
        });

        // --- SEAMLESS LINK CLICK FLASH ANIMATION ---
        linkTargetResult.addEventListener('click', function() {
            linkTargetResult.classList.add('flash-active');
            setTimeout(() => {
                linkTargetResult.classList.remove('flash-active');
                setTimeout(() => {
                    window.location.href = "./index.html";
                }, 500); 
            }, 120); 
        });

        // --- PERFECTED CROSS-IPHONE DYNAMIC VIEWPORT COUNTERACTION ---
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const container = document.getElementById('viewGoogleHome');
                const currentContainerTop = container.getBoundingClientRect().top;
                
                if (currentContainerTop < 0) {
                    googleHomeBg.style.top = `${Math.abs(currentContainerTop)}px`;
                } else {
                    googleHomeBg.style.top = '0px';
                }
            });
        }
    </script>
</body>
</html>
