<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Observer Dashboard</title>
    
    <!-- Loads the exact same traditional Version 8 Firebase base libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Clean, dark visual layout for your covert peek screen -->
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; text-align: center; padding-top: 100px; }
        #peekDisplay { font-size: 48px; font-weight: bold; }
        #historyDisplay { margin-top: 40px; font-size: 16px; color: #666; text-align: left; display: inline-block; }
    </style>
</head>
<body>

    <h1>LIVE MAGIC PEEK VIEW</h1>
    <div id="peekDisplay">Awaiting Selection...</div>
    
    <!-- Simple UI logger to visually keep track of all settled words in a session -->
    <div id="historyDisplay">
        <h3>Settled Selection History:</h3>
        <ul id="historyList"></ul>
    </div>

    <script>
        // Matching live project credentials to link into the spectator's space
        const firebaseConfig = {
            apiKey: "AIzaSyApEFZIG71Fa4OgukSTpyKB-nJXv6Q3TWQ",
            authDomain: "random--word-generator.firebaseapp.com",
            databaseURL: "https://random--word-generator-default-rtdb.firebaseio.com",
            projectId: "random--word-generator",
            storageBucket: "random--word-generator.firebasestorage.app",
            messagingSenderId: "894532217122",
            appId: "1:894532217122:web:cc358ec080280d20dd9d7b"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Timing state machine tracker variables
        let debounceTimer = null;
        const DELAY_THRESHOLD = 4000; // 4 seconds in milliseconds

        // Sets up a permanent live cloud event listener looking at the data path
        database.ref('currentSelection').on('value', function(snapshot) {
            const data = snapshot.val();
            if (data && data.word) {
                const incomingWord = data.word;

                // 1. INSTANT ON-SCREEN PEEK: Your open browser tab updates immediately
                document.getElementById('peekDisplay').textContent = incomingWord;

                // 2. TIMING DELAY FILTER: If the countdown is running, abort it immediately
                if (debounceTimer) {
                    clearTimeout(debounceTimer);
                }

                // 3. START A FRESH COUNTDOWN: Wait for 4 seconds of complete silence
                debounceTimer = setTimeout(function() {
                    
                    // This block will ONLY execute if 4 seconds pass without another word click!
                    triggerLockScreenNotification(incomingWord);
                    
                    // Log the settled word onto the dashboard's visual history list
                    const li = document.createElement('li');
                    li.textContent = incomingWord + " (Settled)";
                    document.getElementById('historyList').appendChild(li);

                }, DELAY_THRESHOLD);
            }
        });

        // Function that sends the final word to your phone's lock screen via NTFY
        function triggerLockScreenNotification(finalWord) {
        // Topic string in base-64
        const topic = "bG92ZS10cmFpbi1zdXBlcmhpZ2h3YXk=";
            
        // CAMOUFLAGE TEXT LAYOUT: Disguises your secret word in a completely normal text message
        const disguisedMessage = `"Hey Kenny, just checking in on your progress with the ${finalWord.toLowerCase()} case. Have you started on the office action..."`;

        // Fires a silent background HTTP request to the NTFY alert network
        fetch('https://ntfy.sh/' + atob(topic), {
                method: 'POST',
                body: disguisedMessage,
                headers: {
                    // CAMOUFLAGE HEADER: Alters the main bold text line on the lock screen alert banner
                    'Title': 'Peter.Vasat@USPTO.gov sent a message:',
                    // VISUAL ANCHOR: Uses a generic speech bubble emoji to serve as a texting app icon
                    'Tags': 'speech_balloon',
                    // CAMOUFLAGE AVATAR: Point this to any public image URL of a portrait.
                    'Icon': 'https://i.imgur.com/ZBrU74B.png'
                }
            })
            .then(() => console.log("Stealth push notification sent successfully."))
            .catch(err => console.error("Notification network delivery error:", err));
        }
    </script>
</body>
</html>
