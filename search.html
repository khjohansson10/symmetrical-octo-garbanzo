<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Google</title>
    <style>
        /* --- CORE VISUAL CANVAS RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: #ffffff; /* Use #121212 for Dark Mode */
            overflow: hidden;
        }

        /* --- CONTAINER 1: FAKE GOOGLE HOMEPAGE & AUTOCOMPLETE TIER --- */
        #viewGoogleHome {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: none;
        }

        .home-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            user-select: none;
            -webkit-user-select: none;
        }

        /* The transparent typing input container layered over the screenshot search bar */
        .invisible-search-input {
            position: absolute;
            top: 36.5%; 
            left: 7%;
            width: 72%;
            height: 46px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            color: #000000; /* Use #ffffff for Dark Mode */
            padding: 0 10px;
            z-index: 30;
        }

        /* Hidden magnifying glass trigger hotzone */
        .search-trigger-hotzone {
            position: absolute;
            top: 36.5%;
            right: 7%;
            width: 50px;
            height: 46px;
            background: transparent;
            cursor: pointer;
            z-index: 40;
        }

        /* NEW: Invisible overlay zone matching the target autocomplete prediction row */
        .autocomplete-suggestion-hotzone {
            position: absolute;
            /* Adjust these geometric dimensions to sit precisely over the "random word generator" text line in your screenshot overlay */
            top: 44%; 
            left: 0;
            width: 100%;
            height: 50px;
            background: transparent;
            cursor: pointer;
            z-index: 50;
            display: none; /* Only active once they start typing the autocomplete path */
        }

        /* --- CONTAINER 2: SCROLLABLE RESULTS ENGINE --- */
        #viewGoogleResults {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch;
            display: none;
        }

        .results-scroll-strip {
            width: 100%;
            height: auto; 
            display: block;
            user-select: none;
            -webkit-user-select: none;
        }

        /* INTERACTIVE TARGET LINK OVERLAY ZONE */
        .target-result-link-hotzone {
            position: absolute;
            top: 142px; 
            left: 0;
            width: 100%;
            height: 85px;
            background: transparent;
            cursor: pointer;
            z-index: 20;
        }

        /* Display State Utility Class */
        .active-view { display: block !important; }
    </style>
</head>
<body>

    <!-- SCREEN 1: THE FAKE SEARCH INTERFACE LAYER -->
    <div id="viewGoogleHome" class="active-view">
        <!-- The source image will change dynamically via JavaScript -->
        <img id="googleHomeBg" src="./images/google_home.png" alt="Google Search Portal" class="home-bg-img">
        
        <input type="text" id="fakeSearchQuery" class="invisible-search-input" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div id="btnExecuteSearch" class="search-trigger-hotzone"></div>
        
        <!-- NEW: Invisible target link layer covering the autocomplete suggestion list row item -->
        <div id="autocompleteHotzone" class="autocomplete-suggestion-hotzone"></div>
    </div>

    <!-- SCREEN 2: SCROLLABLE SEARCH RESULTS INTERFACE -->
    <div id="viewGoogleResults">
        <img src="./images/google_results.png" alt="Google Query Results" class="results-scroll-strip">
        <div id="linkTargetResult" class="target-result-link-hotzone"></div>
    </div>

    <script>
        const fakeSearchQuery = document.getElementById('fakeSearchQuery');
        const googleHomeBg = document.getElementById('googleHomeBg');
        const autocompleteHotzone = document.getElementById('autocompleteHotzone');
        
        const btnExecuteSearch = document.getElementById('btnExecuteSearch');
        const linkTargetResult = document.getElementById('linkTargetResult');
        
        const viewGoogleHome = document.getElementById('viewGoogleHome');
        const viewGoogleResults = document.getElementById('viewGoogleResults');

        // --- NEW: DYNAMIC SEARCH INTERACTION MAPPING LOGIC ---
        // Swaps background images instantly to mirror autocomplete selections as they type
        fakeSearchQuery.addEventListener('input', function() {
            const currentString = fakeSearchQuery.value.toLowerCase().trim();

            if (currentString === "") {
                // If they clear the search bar entirely, show the active blank tray option
                googleHomeBg.src = "./images/blank.png";
                autocompleteHotzone.style.display = "none";
            } else if (currentString === "r") {
                googleHomeBg.src = "./images/r.png";
                autocompleteHotzone.style.display = "block"; // Turn on the invisible target overlay row
            } else if (currentString === "ra") {
                googleHomeBg.src = "./images/ra.png";
                autocompleteHotzone.style.display = "block";
            } else if (currentString === "ran") {
                googleHomeBg.src = "./images/ran.png";
                autocompleteHotzone.style.display = "block";
            } else if (currentString === "rand") {
                googleHomeBg.src = "./images/rand.png";
                autocompleteHotzone.style.display = "block";
            } else if (currentString === "rando") {
                googleHomeBg.src = "./images/rando.png";
                autocompleteHotzone.style.display = "block";
            } else if (currentString === "random" || currentString === "random ") {
                googleHomeBg.src = "./images/random.png";
                autocompleteHotzone.style.display = "block";
            } else {
                // Catch-all: If they continue typing further, fallback gracefully to your terminal word graphic choice
                googleHomeBg.src = "./images/random.png";
                autocompleteHotzone.style.display = "block";
            }
        });

        // Trigger the active autocomplete dropdown swap if they tap the search field to start
        fakeSearchQuery.addEventListener('focus', function() {
            if (fakeSearchQuery.value === "") {
                googleHomeBg.src = "./images/blank.png";
            }
        });

        // --- VIEWPORT TRANSITION CONTROLLERS ---
        function processSearchTransition() {
            if (fakeSearchQuery.value.trim() === "") return; 
            viewGoogleHome.classList.remove('active-view');
            viewGoogleResults.classList.add('active-view');
        }

        // Action 1: Tapping the standard magnifying glass search icon button
        btnExecuteSearch.addEventListener('click', processSearchTransition);

        // Action 2: Hitting native "Go / Enter" keys directly on the iOS device keyboard tray
        fakeSearchQuery.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                fakeSearchQuery.blur(); 
                processSearchTransition();
            }
        });

        // Action 3: NEW – Clicking directly on the invisible predictive suggestion list row layout
        autocompleteHotzone.addEventListener('click', function() {
            fakeSearchQuery.blur();
            processSearchTransition();
        });

        // Action 4: Tapping the top link search results target row maps back into your master utility file
        linkTargetResult.addEventListener('click', function() {
            window.location.href = "./index.html";
        });
    </script>
</body>
</html>
