<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Animation Prop</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="data:application/manifest+json,{'display':'standalone','orientation':'portrait'}">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #000;
            background-size: cover;
            background-position: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Initial configuration UI */
        #setupUI {
            position: fixed;
            insidest: 0;
            z-index: 100;
            background: #1c1c1e;
            color: #fff;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }

        /* Add these classes to manage the multi-screen sliding deck */
        .stage-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #lockScreenStage {
            display: none; /* Controlled via JS */
            z-index: 10;
        }

        #passcodeStage {
            display: none; /* Controlled via JS */
            transform: translateY(100%); /* Positioned off-screen below until swipe */
            z-index: 20;
        }

        /* Lock Screen Top Typography */
        .lock-header {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;
            color: #fff;
        }
        .lock-date {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .lock-time {
            font-size: 80px;
            font-weight: 200;
            margin-top: -5px;
            letter-spacing: -1px;
        }

        /* Lock Screen Bottom Quick Action Circles (Visual Assets Only) */
        .quick-actions {
            position: absolute;
            bottom: 6%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 45px;
            box-sizing: border-box;
        }
        .action-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .action-circle svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        /* Overlay Layout for Keypad Elements */
        #gridContainer {
            display: none;
            position: absolute;
            bottom: 15.6%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 286px;
            grid-template-columns: repeat(3, 75px);
            column-gap: 30px;
            row-gap: 17px;
            justify-content: center;
        }

        /* Non-interactive, purely visual circles */
        .circle-node {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 36px;
            font-weight: 400;
            letter-spacing: -0.5px;
            transition: background 0.1s ease, transform 0.1s ease;
            pointer-events: none;
            padding-top: 2px;
        }

        /* Animated flash class triggered via JS */
        .circle-node.active-flash {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }

        /* Add this new class to format the alphabetical subtext */
        .circle-subtext {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: -3px;
            text-indent: 2px; /* Offsets letter-spacing to center the string */
        }

        /* Add these layout parameters for the passcode entry indicator dots */
        #dotContainer {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .passcode-dot {
            width: 13px;
            height: 13px;
            border: 1px solid #fff;
            border-radius: 50%;
            background: transparent;
            transition: background 0.1s ease;
        }
        .passcode-dot.filled {
            background: #fff;
        }

        /* Footer layout rules for dynamic contextual options */
        #passcodeFooter {
            position: absolute;
            bottom: 6%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 45px;
            box-sizing: border-box;
            color: #fff;
            font-size: 16px;
            font-weight: 400;
        }
        .footer-action {
            cursor: default;
            transition: opacity 0.2s ease;
        }
        #cancelBtn {
            text-align: right;
            min-width: 60px;
        }

        /* Final dynamic status text placement */
        #statusMessage {
            display: none;
            position: absolute;
            top: 25%;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 24px;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- Setup Panel -->
    <div id="setupUI">
        <h2>Performance Setup</h2>
        <p>Choose a background image from your device roll:</p>
        <input type="file" id="bgPicker" accept="image/*">
        <button class="btn" id="startBtn">Activate Prop</button>
    </div>

    <!-- STAGE 1: Visual Lock Screen -->
    <div id="lockScreenStage" class="stage-view">
        <div class="lock-header">
            <div id="lockDate" class="lock-date">Friday, September 19</div>
            <div id="lockTime" class="lock-time">09:41</div>
        </div>
        <div class="quick-actions">
            <!-- Mock Flashlight Icon -->
            <div class="action-circle">
                <svg viewBox="0 0 24 24"><path d="M12 2A2 2 0 0 0 10 4v3.25l-2 2V12h8V9.25l-2-2V4a2 2 0 0 0-2-2zm-3 11v7a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-7H9z"/></svg>
            </div>
            <!-- Mock Camera Icon -->
            <div class="action-circle">
                <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
            </div>
        </div>
    </div>

    <!-- STAGE 2: Passcode Input View -->
    <div id="passcodeStage" class="stage-view">
        
        <!-- Dynamic Passcode Entry Trackers -->
        <div id="dotContainer">
            <div class="passcode-dot"></div>
            <div class="passcode-dot"></div>
            <div class="passcode-dot"></div>
            <div class="passcode-dot"></div>
        </div>

        <!-- Keypad System Grid -->
        <div id="gridContainer">
            <div class="circle-node" data-val="1">1<span class="circle-subtext">&nbsp;</span></div>
            <div class="circle-node" data-val="2">2<span class="circle-subtext">ABC</span></div>
            <div class="circle-node" data-val="3">3<span class="circle-subtext">DEF</span></div>
            <div class="circle-node" data-val="4">4<span class="circle-subtext">GHI</span></div>
            <div class="circle-node" data-val="5">5<span class="circle-subtext">JKL</span></div>
            <div class="circle-node" data-val="6">6<span class="circle-subtext">MNO</span></div>
            <div class="circle-node" data-val="7">7<span class="circle-subtext">PQRS</span></div>
            <div class="circle-node" data-val="8">8<span class="circle-subtext">TUV</span></div>
            <div class="circle-node" data-val="9">9<span class="circle-subtext">WXYZ</span></div>
            <div></div> 
            <div class="circle-node" data-val="0">0<span class="circle-subtext">&nbsp;</span></div>
            <div></div> 
        </div>

        <!-- System Footer Actions -->
        <div id="passcodeFooter">
            <div class="footer-action">Emergency</div>
            <div class="footer-action" id="cancelBtn">Cancel</div>
        </div>
    </div>

    <script>
                const bgPicker = document.getElementById('bgPicker');
        const setupUI = document.getElementById('setupUI');
        const startBtn = document.getElementById('startBtn');
        const lockScreenStage = document.getElementById('lockScreenStage');
        const passcodeStage = document.getElementById('passcodeStage');
        const gridContainer = document.getElementById('gridContainer');

        let touchStartY = 0;

        // Dynamic System Clock Engine
        function updateClock() {
            const now = new Date();
            
            // Format Time (HH:MM)
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('lockTime').textContent = `${hours}:${minutes}`;

            // Format Date (e.g., Saturday, Sep 19)
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('lockDate').textContent = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock(); // Initial paint

        // Local Background Loader
        bgPicker.addEventListener('change', (e) => {
            const selectedFiles = e.target.files;
            if (selectedFiles && selectedFiles[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.body.style.backgroundImage = `url(${event.target.result})`;
                };
                reader.readAsDataURL(selectedFiles[0]);
            }
        });

        // Activation / Fullscreen Entry Trigger
        startBtn.addEventListener('click', () => {
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(err => console.log(err));
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen().catch(err => console.log(err));
            }

            setupUI.style.display = 'none';
            lockScreenStage.style.display = 'block';
            passcodeStage.style.display = 'block';
            gridContainer.style.display = 'grid';
        });

        // Swipe Gesture Registration Engine
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const swipeDistance = touchStartY - touchEndY;

            // Threshold: Swipe upward by more than 80 vertical pixels
            if (swipeDistance > 80 && lockScreenStage.style.display === 'block') {
                transitionToPasscode();
            }
        }, { passive: true });

        function transitionToPasscode() {
            // Animate views using translation transforms
            lockScreenStage.style.transform = 'translateY(-100%)';
            passcodeStage.style.transform = 'translateY(0)';
            
            // Automatically queue sequence execution 1.5 seconds post-transition
            setTimeout(runAutomaticSequence, 1500);
        }

        // Configurable Performance Variables
        const CONFIG = {
            passcodeSequence: ['4', '2', '9', '1'], // Combination targeting sequence
            keystrokeDelay: 600,                    // Delay between individual keypresses (ms)
            postSwipeDelay: 1500                    // Delay after swipe before animation initializes (ms)
        };

        function runAutomaticSequence() {
            let step = 0;
            const dots = document.querySelectorAll('.passcode-dot');
            const cancelBtn = document.getElementById('cancelBtn');

            function triggerNextKey() {
                if (step < CONFIG.passcodeSequence.length) {
                    const currentVal = CONFIG.passcodeSequence[step];
                    const targetNode = document.querySelector(`.circle-node[data-val="${currentVal}"]`);
                    
                    if (targetNode) {
                        // Trigger numeric background active-flash
                        targetNode.classList.add('active-flash');
                        
                        // Increment and fill corresponding track dot
                        if (dots[step]) {
                            dots[step].classList.add('filled');
                        }

                        // Shift structural text context dynamically on initial stroke
                        if (step === 0) {
                            cancelBtn.textContent = 'OK';
                        }
                        
                        setTimeout(() => {
                            targetNode.classList.remove('active-flash');
                        }, 200);
                    }
                    
                    step++;
                    setTimeout(triggerNextKey, CONFIG.keystrokeDelay);
                } else {
                    console.log("Animation timeline sequence successfully finalized.");
                }
            }
            triggerNextKey();
        }

        // Make sure to modify the transition trigger to use the parameterized configuration variable
        function transitionToPasscode() {
            lockScreenStage.style.transform = 'translateY(-100%)';
            passcodeStage.style.transform = 'translateY(0)';
            setTimeout(runAutomaticSequence, CONFIG.postSwipeDelay);
        }

        // Global structural boundary constraints
        document.addEventListener('touchmove', (e) => {
            if (setupUI.style.display === 'none') {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
