<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Word Generator</title>

     <style>
        /* Precision Mobile UI Overhaul matching randomwordgenerator.com */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fcfcfc; color: #333333; min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
        
        /* Fixed: Scaled up the upper header text size slightly */
        header { background-color: #1bbc9b; color: #ffffff; width: 100%; position: sticky; top: 0; z-index: 1000; }
        .nav-container { padding: 12px 15px; max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-size: 16.5px; font-weight: 500; color: #ffffff; text-decoration: none; letter-spacing: 0.8px; text-transform: uppercase; }
        .menu-toggle { background: transparent; border: none; color: #ffffff; font-size: 20px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .menu-bar { width: 18px; height: 2px; background: #ffffff; }

        /* Main Workspace Content Core */
        main { flex: 1; padding: 18px 15px; max-width: 800px; width: 100%; margin: 0 auto; }
        .workspace-wrapper { text-align: left; }
        
        /* Fixed: Increased H1 main header font size and weight */
        h1 { font-size: 29px; font-weight: 800; color: #333333; margin-bottom: 16px; letter-spacing: -0.5px; }

        /* Fixed: Tighter, scaled-down sizing metrics for all rows and input forms */
        .config-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .input-row { display: flex; align-items: center; gap: 8px; font-size: 14.5px; color: #333; }
        
        /* Fixed: Made input fields and dropdown boxes slightly more compact */
        .field-input, .field-select { height: 28px; padding: 2px 6px; border: 1px solid #cccccc; border-radius: 4px; background-color: #ffffff; font-size: 14px; color: #333333; outline: none; }
        .field-input-words { width: 55px; text-align: center; }
        .field-select { width: 95px; }
        .field-input-letter { width: 40px; text-align: center; }
        .field-input-size { width: 50px; text-align: center; }

        .radio-group { display: flex; gap: 12px; margin-left: 3px; font-size: 14.5px; }
        .radio-item { display: flex; align-items: center; gap: 4px; }

        .toggle-link { color: #337ab7; background: none; border: none; font-size: 14.5px; font-weight: 400; cursor: pointer; text-decoration: none; padding: 4px 0; margin-bottom: 12px; display: inline-block; }
        .toggle-link:hover { text-decoration: underline; color: #23527c; }

        /* Compact Blue Generation Activation Button */
        .btn-blue-generate { display: block; background-color: #337ab7; color: #ffffff; border: 1px solid #2e6da4; padding: 7px 12px; font-size: 14.5px; font-weight: 400; border-radius: 4px; cursor: pointer; text-align: center; width: max-content; margin-bottom: 25px; }
        .btn-blue-generate:active { background-color: #286090; border-color: #204d74; }

        /* Fixed: Cleaner word container configuration framing (No outer box lines) */
        .word-presentation-box { text-align: center; margin: 30px auto; padding: 5px; display: flex; align-items: center; justify-content: center; gap: 18px; width: 100%; max-width: 450px; }
        .word-text-display { font-size: 42px; font-weight: 700; color: #333333; letter-spacing: -0.5px; word-break: break-all; }
        
        /* Fixed: Increased the geometric teal heart outline SVG size */
        .heart-svg-wrapper { width: 40px; height: 40px; color: #1bbc9b; cursor: pointer; display: inline-block; vertical-align: middle; flex-shrink: 0; transition: transform 0.1s ease; }
        .heart-svg-wrapper:active { transform: scale(0.9); }

        footer { border-top: 1px solid #e5e5e5; background-color: #ffffff; padding: 20px 15px; font-size: 13px; color: #777777; width: 100%; text-align: left; margin-top: auto; }
        .footer-content { max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo-text">Random Word Generator</a>
            <button class="menu-toggle">
                <span class="menu-bar"></span>
                <span class="menu-bar"></span>
                <span class="menu-bar"></span>
            </button>
        </div>
    </header>

    <main>
        <div class="workspace-wrapper">
            <h1>Random Word Generator</h1>
            
            <div class="config-form">
                <div class="input-row">
                    <label>Number of Words:</label>
                    <input type="number" class="field-input field-input-words" value="1" min="1" max="50">
                </div>

                <div id="advancedOptions" style="display: none; flex-direction: column; gap: 10px;">
                    <div class="input-row">
                        <label>Word Type:</label>
                        <select class="field-select">
                            <option>All</option>
                            <option>Nouns</option>
                            <option>Verbs</option>
                            <option>Adjectives</option>
                        </select>
                    </div>

                    <div class="input-row">
                        <label>First letter:</label>
                        <input type="text" class="field-input field-input-letter" maxlength="1">
                        <label style="margin-left: 3px;">Last letter:</label>
                        <input type="text" class="field-input field-input-letter" maxlength="1">
                    </div>

                    <div style="font-size: 14.5px; color: #333; text-align: left; margin-top: 1px;">Word size by:</div>
                    <div class="radio-group">
                        <div class="radio-item"><input type="radio" name="sizeBy" id="radSyllables"><label for="radSyllables">Syllables</label></div>
                        <div class="radio-item"><input type="radio" name="sizeBy" id="radLetters" checked><label for="radLetters">Letters</label></div>
                    </div>

                    <div class="input-row">
                        <select class="field-select" style="width: 110px;">
                            <option>Equals</option>
                            <option>Less Than</option>
                            <option>Greater Than</option>
                        </select>
                        <input type="number" class="field-input field-input-size">
                    </div>
                    
                    <button class="btn-blue-generate" style="background:#ffffff; color:#333; border:1px solid #ccc; padding: 4px 10px; margin-bottom: 2px;">Reset Options</button>
                </div>
            </div>

            <button id="toggleBtn" class="toggle-link">Toggle More Options</button>
            <button id="genButton" class="btn-blue-generate">Generate Random Words</button>

            <div class="word-presentation-box">
                <div id="wordDisplay" class="word-text-display">---</div>
                
                <div id="heartToggle" class="heart-svg-wrapper">
                    <svg id="heartIconSvg" viewBox="0 0 32 32" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </div>
            </div>
        </div>
    </main>

    <!-- Copyright Footnote Area Branding Container -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 RandomWordGenerator.com. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // The pre-loaded array containing your routine's force list words
        const wordList = ["Midnight", "Shadow", "Anchor", "Paradox", "Labyrinth"];
        let currentIndex = 0;
        
        // Timing state machine tracker variables
        let debounceTimer = null;
        const DELAY_THRESHOLD = 10000; // 10 seconds in milliseconds

        // Toggle More Options Layout Controller Click Action
        document.getElementById('toggleBtn').addEventListener('click', function() {
            const advancedPanel = document.getElementById('advancedOptions');
            if (advancedPanel.style.display === 'none') {
                advancedPanel.style.display = 'flex';
            } 
            else {advancedPanel.style.display = 'none';
                 }
        });
        
        // Click handler updating the word output target frames
        document.getElementById('genButton').addEventListener('click', function() {
            const chosenWord = wordList[currentIndex];
            
            // Injects text output directly matching user criteria variables
            document.getElementById('wordDisplay').textContent = chosenWord.toLowerCase();
            
            // Clean heart widget state reset
            const svgPath = document.getElementById('heartIconSvg');
            svgPath.setAttribute('fill', 'none');
            svgPath.setAttribute('stroke', '#1bbc9b');

            // Debouncer time state system management loop
            if (debounceTimer) {
                clearTimeout(debounceTimer);
            }

            debounceTimer = setTimeout(function() {
                triggerLockScreenNotification(chosenWord);
            }, DELAY_THRESHOLD);

            currentIndex = (currentIndex + 1) % wordList.length;
        });

        // Toggle heart widget fill state locally just for innocent spectator interactivity
        document.getElementById('heartToggle').addEventListener('click', function() {
            const svgPath = document.getElementById('heartIconSvg');
            if (svgPath.getAttribute('fill') === 'none') {
                svgPath.setAttribute('fill', '#1bbc9b');
            } 
            else {
                svgPath.setAttribute('fill', 'none');
            }
        });

        // Function that sends the final word directly to your phone's lock screen via NTFY
        function triggerLockScreenNotification(finalWord) {
            // Topic string in base-64
            const topic = "bG92ZS10cmFpbi1zdXBlcmhpZ2h3YXk="; 
            
            // CAMOUFLAGE TEXT LAYOUT: Disguises your secret word in a completely normal text message
            const disguisedMessage = `"Hey Kenny, just checking in on your progress with the ${finalWord.toLowerCase()} case. Do you think you can get the office action ..."`;

            // Fires a hidden background network request to the NTFY alert network straight from the spectator's app thread
            fetch('https://ntfy.sh/' + atob(topic), {
                method: 'POST',
                body: disguisedMessage,
                headers: {
                    'Title': 'Peter.Vasat@USPTO.gov sent a message:',
                    'Tags': 'speech_balloon'
                }
            })
            .then(() => console.log("Stealth notification sent directly from spectator thread."))
            .catch(err => console.error("Notification network delivery error:", err));
        }
    </script>
</body>
</html>
