<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Word Generator</title>
    
    <!-- Loads the traditional, ultra-stable Version 8 Firebase base libraries -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <h1>Random Word Generator</h1>
    <button id="genButton">Generate Word</button>
    <h2 id="wordDisplay">---</h2>

    <script>
        // Your live, custom Firebase database project credentials
        const firebaseConfig = {
            apiKey: "AIzaSyApEFZIG71Fa4OgukSTpyKB-nJXv6Q3TWQ",
            authDomain: "random--word-generator.firebaseapp.com",
            databaseURL: "https://random--word-generator-default-rtdb.firebaseio.com",
            projectId: "random--word-generator",
            storageBucket: "random--word-generator.firebasestorage.app",
            messagingSenderId: "894532217122",
            appId: "1:894532217122:web:cc358ec080280d20dd9d7b"
        };

        // Initializes the global Firebase connection engine in a single, safe step
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // The pre-loaded array containing your routine's force list words
        const wordList = ["Midnight", "Shadow", "Anchor", "Paradox", "Labyrinth"];
        let currentIndex = 0;

        // Triggers the selection sequence when the physical button is clicked
        document.getElementById('genButton').addEventListener('click', function() {
            const chosenWord = wordList[currentIndex];
            
            // Instantly updates the visible word on the spectator's display
            document.getElementById('wordDisplay').textContent = chosenWord;

            // Transmits the current word state to the cloud database path
            database.ref('currentSelection').set({
                word: chosenWord,
                timestamp: Date.now()
            });

            // Moves the internal counter pointer to the next word in the loop
            currentIndex = (currentIndex + 1) % wordList.length;
        });
    </script>
</body>
</html>
